name: Publish NPM packages
on:
  push:
    tags:
      - "rest@**"
      - "grpc@**"

jobs:
  publish-grpc:
    environment: release
    permissions:
      id-token: write
      contents: read
    name: Publish - GRPC package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/grpc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.11.0"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.4.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Publish
        run: |
          pnpm config set provenance true
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          pnpm publish --access public --no-git-checks
        working-directory: packages/liteparse-grpc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-rest:
    environment: release
    permissions:
      id-token: write
      contents: read
    name: Publish - REST package
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/rest') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "11.11.0"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.4.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Publish
        run: |
          pnpm config set provenance true
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          pnpm publish --access public --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
